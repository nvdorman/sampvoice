name: Build SAMPVOICE Client

on:
  push:
    branches: [ "release-v3.1", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release-v3.1", "main", "master" ]
  workflow_dispatch:

jobs:
  # ============================================
  # Build Client (Windows Only - ASI Plugin)
  # ============================================
  build-client:
    name: Build Client (Windows)
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Cache DirectX SDK
      id: cache-dxsdk
      uses: actions/cache@v4
      with:
        path: C:\DXSDK
        key: directx-sdk-june2010-v2
    
    - name: Install DirectX SDK via Chocolatey
      if: steps.cache-dxsdk.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        Write-Host "Installing DirectX SDK via Chocolatey..."
        choco install directx-sdk -y --no-progress
        
        # Verify installation
        if (Test-Path "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)") {
          Write-Host "DirectX SDK installed successfully"
          # Copy to cache location
          Copy-Item -Path "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)" -Destination "C:\DXSDK" -Recurse -Force
        } else {
          Write-Host "DirectX SDK installation path not found, checking alternatives..."
          Get-ChildItem "C:\Program Files (x86)" | Where-Object { $_.Name -like "*DirectX*" }
        }
    
    - name: Setup DirectX SDK Environment
      shell: powershell
      run: |
        # Check cache location first
        if (Test-Path "C:\DXSDK") {
          $dxsdkPath = "C:\DXSDK"
        } elseif (Test-Path "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)") {
          $dxsdkPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        } else {
          Write-Error "DirectX SDK not found!"
          exit 1
        }
        
        Write-Host "Using DirectX SDK from: $dxsdkPath"
        echo "DXSDK_DIR=$dxsdkPath\" >> $env:GITHUB_ENV
        
        # Also add to include/lib paths
        echo "DXSDK_INCLUDE=$dxsdkPath\Include" >> $env:GITHUB_ENV
        echo "DXSDK_LIB=$dxsdkPath\Lib\x86" >> $env:GITHUB_ENV
    
    - name: Create output directory
      shell: cmd
      run: |
        if not exist "bin" mkdir bin
    
    - name: Build Client (Release|Win32)
      working-directory: ${{github.workspace}}
      shell: cmd
      run: |
        echo Building SAMPVOICE Client...
        echo DXSDK_DIR=%DXSDK_DIR%
        
        msbuild client/client.vcxproj ^
          /p:Configuration=Release ^
          /p:Platform=Win32 ^
          /p:PlatformToolset=v143 ^
          /p:WindowsTargetPlatformVersion=10.0.22621.0 ^
          /p:IncludePath="%DXSDK_INCLUDE%;$(IncludePath)" ^
          /p:LibraryPath="%DXSDK_LIB%;$(LibraryPath)" ^
          /m ^
          /v:minimal
    
    - name: List output files
      shell: cmd
      run: |
        echo === Checking bin directory ===
        if exist bin dir /s bin
        echo === Checking for ASI files ===
        dir /s *.asi 2>nul || echo No ASI files found
        echo === Checking for DLL files ===
        dir /s *.dll 2>nul || echo No DLL files found
    
    - name: Upload Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sampvoice-client-windows
        path: |
          bin/sampvoice.asi
          bin/*.asi
          bin/*.dll
        if-no-files-found: warn

  # ============================================
  # Create Release Package
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-client]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download client artifact
      uses: actions/download-artifact@v4
      with:
        name: sampvoice-client-windows
        path: release/
    
    - name: Create release package
      run: |
        cd release
        zip -r ../sampvoice-client-${{ github.ref_name }}.zip .
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: sampvoice-client-${{ github.ref_name }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
