name: Build SAMPVOICE

on:
  push:
    branches: [ "release-v3.1", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release-v3.1", "main", "master" ]
  workflow_dispatch:

env:
  SOLUTION_FILE: sampvoice.sln

jobs:
  # ============================================
  # Build Client & Server (Windows)
  # Uses Visual Studio 2019 as per original build instructions
  # ============================================
  build-windows:
    name: Build Windows (${{ matrix.config.name }})
    runs-on: windows-2019
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "R1"
            macro: "SAMP_R1"
          - name: "R3"  
            macro: "SAMP_R3"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1
    
    - name: Cache DirectX SDK
      id: cache-dxsdk
      uses: actions/cache@v4
      with:
        path: C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)
        key: directx-sdk-june2010
    
    - name: Install DirectX SDK
      if: steps.cache-dxsdk.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        Write-Host "Installing DirectX SDK..."
        choco install directx-sdk -y --no-progress
        
        if (Test-Path "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)") {
          Write-Host "DirectX SDK installed successfully"
        } else {
          Write-Error "DirectX SDK installation failed!"
          exit 1
        }
    
    - name: Set DXSDK_DIR environment
      shell: powershell
      run: |
        $dxsdkPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        echo "DXSDK_DIR=$dxsdkPath\" >> $env:GITHUB_ENV
        
        # Add DirectX SDK utilities (fxc.exe) to PATH
        $dxsdkBinPath = "$dxsdkPath\Utilities\bin\x86"
        $currentPath = [Environment]::GetEnvironmentVariable("PATH", "Process")
        echo "PATH=$dxsdkBinPath;$currentPath" >> $env:GITHUB_ENV
        
        Write-Host "DXSDK_DIR set to: $dxsdkPath"
        Write-Host "Added to PATH: $dxsdkBinPath"
    
    - name: Build Solution (Release|x86) - ${{ matrix.config.name }}
      shell: cmd
      run: |
        echo === Building SAMPVOICE (${{ matrix.config.name }}) ===
        echo DXSDK_DIR=%DXSDK_DIR%
        
        msbuild %SOLUTION_FILE% ^
          /p:Configuration=Release ^
          /p:Platform=x86 ^
          /p:PreprocessorDefinitions="${{ matrix.config.macro }};_WINDLL;NDEBUG;%%(PreprocessorDefinitions)" ^
          /m ^
          /v:minimal
    
    - name: Find build outputs
      shell: powershell
      run: |
        Write-Host "=== Searching for build outputs ==="
        Get-ChildItem -Path . -Include *.asi,*.dll -Recurse -ErrorAction SilentlyContinue | ForEach-Object { 
          Write-Host $_.FullName 
        }
    
    - name: Create release directory
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "release\client"
        New-Item -ItemType Directory -Force -Path "release\server\plugins"
        New-Item -ItemType Directory -Force -Path "release\server\pawno\include"
        
        # Copy client ASI
        if (Test-Path "bin\sampvoice.asi") {
          Copy-Item "bin\sampvoice.asi" "release\client\"
          Write-Host "Copied client ASI from bin\"
        } elseif (Test-Path "client\bin\sampvoice.asi") {
          Copy-Item "client\bin\sampvoice.asi" "release\client\"
          Write-Host "Copied client ASI from client\bin\"
        }
        
        # Copy server DLL
        if (Test-Path "bin\sampvoice.dll") {
          Copy-Item "bin\sampvoice.dll" "release\server\plugins\"
          Write-Host "Copied server DLL from bin\"
        } elseif (Test-Path "server\bin\sampvoice.dll") {
          Copy-Item "server\bin\sampvoice.dll" "release\server\plugins\"
          Write-Host "Copied server DLL from server\bin\"
        }
        
        # Copy include file
        Copy-Item "server\sampvoice.inc" "release\server\pawno\include\"
        
        # Copy required DLLs for client
        if (Test-Path "setup\files") {
          Copy-Item "setup\files\*.dll" "release\client\" -ErrorAction SilentlyContinue
        }
    
    - name: Upload Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sv_client_037_${{ matrix.config.name }}_windows
        path: release/client/
        if-no-files-found: warn
    
    - name: Upload Server Artifact (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: sv_server_037_windows
        path: release/server/
        if-no-files-found: warn

  # ============================================
  # Build Server (Linux)
  # ============================================
  build-linux-server:
    name: Build Server (Linux)
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib g++-multilib
    
    - name: Build Server
      working-directory: server
      run: make
    
    - name: Create release directory
      run: |
        mkdir -p release/plugins
        mkdir -p release/pawno/include
        
        cp server/sampvoice.so release/plugins/
        cp server/sampvoice.inc release/pawno/include/
    
    - name: Upload Server Artifact (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: sv_server_037_linux
        path: release/
        if-no-files-found: warn

  # ============================================
  # Package Release
  # ============================================
  package:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux-server]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
    
    - name: List artifacts
      run: |
        echo "=== Downloaded artifacts ==="
        find artifacts/ -type f
    
    - name: Create release packages
      run: |
        mkdir -p release
        
        # Package client R1
        if [ -d "artifacts/sv_client_037_R1_windows" ]; then
          cd artifacts/sv_client_037_R1_windows
          zip -r ../../release/sv_client_037_r1.zip .
          cd ../..
        fi
        
        # Package client R3
        if [ -d "artifacts/sv_client_037_R3_windows" ]; then
          cd artifacts/sv_client_037_R3_windows
          zip -r ../../release/sv_client_037_r3.zip .
          cd ../..
        fi
        
        # Package server Windows
        if [ -d "artifacts/sv_server_037_windows" ]; then
          cd artifacts/sv_server_037_windows
          zip -r ../../release/sv_server_037_win32.zip .
          cd ../..
        fi
        
        # Package server Linux
        if [ -d "artifacts/sv_server_037_linux" ]; then
          cd artifacts/sv_server_037_linux
          zip -r ../../release/sv_server_037_linux.zip .
          cd ../..
        fi
        
        echo "=== Release packages ==="
        ls -la release/
    
    - name: Upload combined release
      uses: actions/upload-artifact@v4
      with:
        name: sampvoice-release
        path: release/
        if-no-files-found: warn

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download release packages
      uses: actions/download-artifact@v4
      with:
        name: sampvoice-release
        path: release/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
