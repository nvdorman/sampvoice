name: Build SAMPVOICE Client

on:
  push:
    branches: [ "release-v3.1", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release-v3.1", "main", "master" ]
  workflow_dispatch:

jobs:
  build-client:
    name: Build Client (Windows)
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup Visual Studio Dev Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
    
    - name: Cache DirectX SDK
      id: cache-dxsdk
      uses: actions/cache@v4
      with:
        path: C:\DXSDK
        key: directx-sdk-june2010-v3
    
    - name: Install DirectX SDK
      if: steps.cache-dxsdk.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        Write-Host "Installing DirectX SDK via Chocolatey..."
        choco install directx-sdk -y --no-progress
        
        $srcPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        if (Test-Path $srcPath) {
          Write-Host "DirectX SDK installed successfully"
          Copy-Item -Path $srcPath -Destination "C:\DXSDK" -Recurse -Force
        } else {
          Write-Error "DirectX SDK installation failed!"
          exit 1
        }
    
    - name: Restore DirectX SDK from cache
      if: steps.cache-dxsdk.outputs.cache-hit == 'true'
      shell: powershell
      run: |
        Write-Host "Restoring DirectX SDK from cache..."
        if (-not (Test-Path "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)")) {
          Copy-Item -Path "C:\DXSDK" -Destination "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)" -Recurse -Force
        }
    
    - name: Setup Environment Variables
      shell: powershell
      run: |
        $dxsdkPath = "C:\DXSDK"
        if (-not (Test-Path $dxsdkPath)) {
          $dxsdkPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        }
        
        Write-Host "DXSDK Path: $dxsdkPath"
        echo "DXSDK_DIR=$dxsdkPath\" >> $env:GITHUB_ENV
        
        # Add DirectX SDK to INCLUDE and LIB paths
        $currentInclude = $env:INCLUDE
        $currentLib = $env:LIB
        
        $newInclude = "$dxsdkPath\Include;$currentInclude"
        $newLib = "$dxsdkPath\Lib\x86;$currentLib"
        
        echo "INCLUDE=$newInclude" >> $env:GITHUB_ENV
        echo "LIB=$newLib" >> $env:GITHUB_ENV
        
        Write-Host "Added DirectX SDK Include: $dxsdkPath\Include"
        Write-Host "Added DirectX SDK Lib: $dxsdkPath\Lib\x86"
    
    - name: Create output directory
      shell: cmd
      run: if not exist "bin" mkdir bin
    
    - name: Build Client
      shell: cmd
      run: |
        echo === Build Environment ===
        echo DXSDK_DIR=%DXSDK_DIR%
        
        echo === Building SAMPVOICE Client ===
        msbuild client/client.vcxproj ^
          /p:Configuration=Release ^
          /p:Platform=Win32 ^
          /p:PlatformToolset=v143 ^
          /p:WindowsTargetPlatformVersion=10.0 ^
          /p:VCToolsVersion= ^
          /p:UseEnv=true ^
          /m ^
          /v:normal
    
    - name: Find output files
      if: always()
      shell: powershell
      run: |
        Write-Host "=== Searching for output files ==="
        Get-ChildItem -Path . -Include *.asi,*.dll -Recurse | ForEach-Object { Write-Host $_.FullName }
        
        if (Test-Path "client/bin") {
          Write-Host "=== Contents of client/bin folder ==="
          Get-ChildItem -Path "client/bin" -Recurse
        }
    
    - name: Upload Client Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: sampvoice-client-windows
        path: client/bin/sampvoice.asi
        if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-client]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: sampvoice-client-windows
        path: release/
    
    - name: Create ZIP
      run: |
        cd release
        zip -r ../sampvoice-client-${{ github.ref_name }}.zip .
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: sampvoice-client-${{ github.ref_name }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
