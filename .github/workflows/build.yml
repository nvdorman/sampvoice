name: Build SAMPVOICE

on:
  push:
    branches: [ "release-v3.1", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release-v3.1", "main", "master" ]
  workflow_dispatch:

jobs:
  # ============================================
  # Build Client R1
  # ============================================
  build-client-r1:
    name: Build Client (R1)
    runs-on: windows-2019
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1
    
    - name: Cache DirectX SDK
      id: cache-dxsdk
      uses: actions/cache@v4
      with:
        path: C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)
        key: directx-sdk-june2010
    
    - name: Install DirectX SDK
      if: steps.cache-dxsdk.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        choco install directx-sdk -y --no-progress
    
    - name: Setup Environment
      shell: powershell
      run: |
        $dxsdkPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        echo "DXSDK_DIR=$dxsdkPath\" >> $env:GITHUB_ENV
        
        $dxsdkBinPath = "$dxsdkPath\Utilities\bin\x86"
        $currentPath = [Environment]::GetEnvironmentVariable("PATH", "Process")
        echo "PATH=$dxsdkBinPath;$currentPath" >> $env:GITHUB_ENV
    
    - name: Clean build
      shell: cmd
      run: |
        if exist bin rmdir /s /q bin
        if exist client\bin rmdir /s /q client\bin
        if exist client\temp rmdir /s /q client\temp
    
    - name: Build Client R1
      shell: cmd
      run: |
        echo === Building Client R1 (SAMP_R1) ===
        msbuild client\client.vcxproj ^
          /t:Clean;Build ^
          /p:Configuration=Release ^
          /p:Platform=Win32 ^
          /p:PreprocessorDefinitions="SAMP_R1;_WINDLL;NDEBUG" ^
          /m /v:minimal
    
    - name: Check output size
      shell: powershell
      run: |
        $asiPath = "bin\sampvoice.asi"
        if (-not (Test-Path $asiPath)) {
          $asiPath = "client\bin\sampvoice.asi"
        }
        if (Test-Path $asiPath) {
          $size = (Get-Item $asiPath).Length / 1KB
          Write-Host "sampvoice.asi size: $([math]::Round($size, 2)) KB"
        }
    
    - name: Prepare artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "output"
        
        $asiPath = "bin\sampvoice.asi"
        if (-not (Test-Path $asiPath)) {
          $asiPath = "client\bin\sampvoice.asi"
        }
        
        if (Test-Path $asiPath) {
          Copy-Item $asiPath "output\sampvoice.asi"
        }
        
        # Copy required DLLs
        if (Test-Path "setup\files") {
          Copy-Item "setup\files\bass.dll" "output\" -ErrorAction SilentlyContinue
          Copy-Item "setup\files\bass_fx.dll" "output\" -ErrorAction SilentlyContinue
        }
    
    - name: Upload Client R1
      uses: actions/upload-artifact@v4
      with:
        name: sv_client_037_r1
        path: output/
        if-no-files-found: error

  # ============================================
  # Build Client R3
  # ============================================
  build-client-r3:
    name: Build Client (R3)
    runs-on: windows-2019
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1
    
    - name: Cache DirectX SDK
      id: cache-dxsdk
      uses: actions/cache@v4
      with:
        path: C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)
        key: directx-sdk-june2010
    
    - name: Install DirectX SDK
      if: steps.cache-dxsdk.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        choco install directx-sdk -y --no-progress
    
    - name: Setup Environment
      shell: powershell
      run: |
        $dxsdkPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        echo "DXSDK_DIR=$dxsdkPath\" >> $env:GITHUB_ENV
        
        $dxsdkBinPath = "$dxsdkPath\Utilities\bin\x86"
        $currentPath = [Environment]::GetEnvironmentVariable("PATH", "Process")
        echo "PATH=$dxsdkBinPath;$currentPath" >> $env:GITHUB_ENV
    
    - name: Clean build
      shell: cmd
      run: |
        if exist bin rmdir /s /q bin
        if exist client\bin rmdir /s /q client\bin
        if exist client\temp rmdir /s /q client\temp
    
    - name: Build Client R3
      shell: cmd
      run: |
        echo === Building Client R3 (SAMP_R3) ===
        msbuild client\client.vcxproj ^
          /t:Clean;Build ^
          /p:Configuration=Release ^
          /p:Platform=Win32 ^
          /p:PreprocessorDefinitions="SAMP_R3;_WINDLL;NDEBUG" ^
          /m /v:minimal
    
    - name: Check output size
      shell: powershell
      run: |
        $asiPath = "bin\sampvoice.asi"
        if (-not (Test-Path $asiPath)) {
          $asiPath = "client\bin\sampvoice.asi"
        }
        if (Test-Path $asiPath) {
          $size = (Get-Item $asiPath).Length / 1KB
          Write-Host "sampvoice.asi size: $([math]::Round($size, 2)) KB"
        }
    
    - name: Prepare artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "output"
        
        $asiPath = "bin\sampvoice.asi"
        if (-not (Test-Path $asiPath)) {
          $asiPath = "client\bin\sampvoice.asi"
        }
        
        if (Test-Path $asiPath) {
          Copy-Item $asiPath "output\sampvoice.asi"
        }
        
        # Copy required DLLs
        if (Test-Path "setup\files") {
          Copy-Item "setup\files\bass.dll" "output\" -ErrorAction SilentlyContinue
          Copy-Item "setup\files\bass_fx.dll" "output\" -ErrorAction SilentlyContinue
        }
    
    - name: Upload Client R3
      uses: actions/upload-artifact@v4
      with:
        name: sv_client_037_r3
        path: output/
        if-no-files-found: error

  # ============================================
  # Build Server (Windows)
  # ============================================
  build-server-win:
    name: Build Server (Windows)
    runs-on: windows-2019
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1
    
    - name: Clean and Build Server
      shell: cmd
      run: |
        if exist bin rmdir /s /q bin
        if exist server\bin rmdir /s /q server\bin
        if exist server\temp rmdir /s /q server\temp
        
        msbuild server\server.vcxproj ^
          /t:Clean;Build ^
          /p:Configuration=Release ^
          /p:Platform=Win32 ^
          /m /v:minimal
    
    - name: Prepare artifacts
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "output\plugins"
        New-Item -ItemType Directory -Force -Path "output\pawno\include"
        
        $dllPath = "bin\sampvoice.dll"
        if (-not (Test-Path $dllPath)) {
          $dllPath = "server\bin\sampvoice.dll"
        }
        
        if (Test-Path $dllPath) {
          Copy-Item $dllPath "output\plugins\"
        }
        
        Copy-Item "server\sampvoice.inc" "output\pawno\include\"
    
    - name: Upload Server Windows
      uses: actions/upload-artifact@v4
      with:
        name: sv_server_037_win32
        path: output/
        if-no-files-found: warn

  # ============================================
  # Build Server (Linux)
  # ============================================
  build-server-linux:
    name: Build Server (Linux)
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib g++-multilib
    
    - name: Build Server
      working-directory: server
      run: make
    
    - name: Prepare artifacts
      run: |
        mkdir -p output/plugins
        mkdir -p output/pawno/include
        
        cp server/sampvoice.so output/plugins/
        cp server/sampvoice.inc output/pawno/include/
    
    - name: Upload Server Linux
      uses: actions/upload-artifact@v4
      with:
        name: sv_server_037_linux
        path: output/
        if-no-files-found: warn

  # ============================================
  # Create Release
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-client-r1, build-client-r3, build-server-win, build-server-linux]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download R1
      uses: actions/download-artifact@v4
      with:
        name: sv_client_037_r1
        path: sv_client_037_r1/
    
    - name: Download R3
      uses: actions/download-artifact@v4
      with:
        name: sv_client_037_r3
        path: sv_client_037_r3/
    
    - name: Download Server Win
      uses: actions/download-artifact@v4
      with:
        name: sv_server_037_win32
        path: sv_server_037_win32/
      continue-on-error: true
    
    - name: Download Server Linux
      uses: actions/download-artifact@v4
      with:
        name: sv_server_037_linux
        path: sv_server_037_linux/
      continue-on-error: true
    
    - name: Create ZIPs
      run: |
        zip -r sv_client_037_r1.zip sv_client_037_r1/
        zip -r sv_client_037_r3.zip sv_client_037_r3/
        [ -d sv_server_037_win32 ] && zip -r sv_server_037.zip sv_server_037_win32/ sv_server_037_linux/ || true
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          sv_client_037_r1.zip
          sv_client_037_r3.zip
          sv_server_037.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
