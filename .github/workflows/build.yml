name: Build SAMPVOICE Client

on:
  push:
    branches: [ "release-v3.1", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release-v3.1", "main", "master" ]
  workflow_dispatch:

jobs:
  build-client:
    name: Build Client (${{ matrix.samp_version }})
    runs-on: windows-2019
    
    strategy:
      matrix:
        include:
          - samp_version: "R1"
            samp_macro: "SAMP_R1"
            output_name: "sampvoice_r1"
          - samp_version: "R3"
            samp_macro: "SAMP_R3"
            output_name: "sampvoice_r3"
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup Visual Studio Dev Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86
        toolset: 14.29
    
    - name: Cache DirectX SDK
      id: cache-dxsdk
      uses: actions/cache@v4
      with:
        path: C:\DXSDK
        key: directx-sdk-june2010-v4
    
    - name: Install DirectX SDK
      if: steps.cache-dxsdk.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        Write-Host "Installing DirectX SDK via Chocolatey..."
        choco install directx-sdk -y --no-progress
        
        $srcPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        if (Test-Path $srcPath) {
          Write-Host "DirectX SDK installed successfully"
          Copy-Item -Path $srcPath -Destination "C:\DXSDK" -Recurse -Force
        } else {
          Write-Error "DirectX SDK installation failed!"
          exit 1
        }
    
    - name: Setup Environment Variables
      shell: powershell
      run: |
        $dxsdkPath = "C:\DXSDK"
        if (-not (Test-Path $dxsdkPath)) {
          $dxsdkPath = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        }
        
        Write-Host "DXSDK Path: $dxsdkPath"
        echo "DXSDK_DIR=$dxsdkPath\" >> $env:GITHUB_ENV
        
        # Add DirectX SDK to INCLUDE and LIB paths
        $currentInclude = $env:INCLUDE
        $currentLib = $env:LIB
        
        $newInclude = "$dxsdkPath\Include;$currentInclude"
        $newLib = "$dxsdkPath\Lib\x86;$currentLib"
        
        echo "INCLUDE=$newInclude" >> $env:GITHUB_ENV
        echo "LIB=$newLib" >> $env:GITHUB_ENV
        
        Write-Host "Added DirectX SDK Include: $dxsdkPath\Include"
        Write-Host "Added DirectX SDK Lib: $dxsdkPath\Lib\x86"
    
    - name: Create output directory
      shell: cmd
      run: if not exist "bin" mkdir bin
    
    - name: Build Client (${{ matrix.samp_version }})
      shell: cmd
      run: |
        echo === Build Configuration ===
        echo SAMP Version: ${{ matrix.samp_version }}
        echo Macro: ${{ matrix.samp_macro }}
        echo DXSDK_DIR: %DXSDK_DIR%
        
        echo === Building SAMPVOICE Client ===
        msbuild client/client.vcxproj ^
          /p:Configuration=Release ^
          /p:Platform=Win32 ^
          /p:PlatformToolset=v142 ^
          /p:WindowsTargetPlatformVersion=10.0 ^
          /p:PreprocessorDefinitions="${{ matrix.samp_macro }};_WINDLL;NDEBUG;%%(PreprocessorDefinitions)" ^
          /p:UseEnv=true ^
          /m ^
          /v:minimal
    
    - name: Rename output file
      shell: powershell
      run: |
        if (Test-Path "client/bin/sampvoice.asi") {
          Copy-Item "client/bin/sampvoice.asi" "client/bin/${{ matrix.output_name }}.asi"
          Write-Host "Renamed to ${{ matrix.output_name }}.asi"
        }
    
    - name: Upload Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sampvoice-client-${{ matrix.samp_version }}
        path: |
          client/bin/sampvoice.asi
          client/bin/${{ matrix.output_name }}.asi
        if-no-files-found: error

  package:
    name: Package All Builds
    runs-on: ubuntu-latest
    needs: [build-client]
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download R1 artifact
      uses: actions/download-artifact@v4
      with:
        name: sampvoice-client-R1
        path: artifacts/r1/
    
    - name: Download R3 artifact
      uses: actions/download-artifact@v4
      with:
        name: sampvoice-client-R3
        path: artifacts/r3/
    
    - name: Create packages
      run: |
        mkdir -p release
        
        # Create R1 package
        mkdir -p release/sv_client_037_r1
        cp artifacts/r1/sampvoice.asi release/sv_client_037_r1/ 2>/dev/null || cp artifacts/r1/sampvoice_r1.asi release/sv_client_037_r1/sampvoice.asi
        
        # Create R3 package
        mkdir -p release/sv_client_037_r3
        cp artifacts/r3/sampvoice.asi release/sv_client_037_r3/ 2>/dev/null || cp artifacts/r3/sampvoice_r3.asi release/sv_client_037_r3/sampvoice.asi
        
        # Copy required DLLs from setup/files
        if [ -d "setup/files" ]; then
          cp setup/files/*.dll release/sv_client_037_r1/ 2>/dev/null || true
          cp setup/files/*.dll release/sv_client_037_r3/ 2>/dev/null || true
        fi
        
        # Create ZIP files
        cd release
        zip -r ../sv_client_037_r1.zip sv_client_037_r1/
        zip -r ../sv_client_037_r3.zip sv_client_037_r3/
        
        echo "=== Package contents ==="
        ls -la ../sv_client_037_r1.zip ../sv_client_037_r3.zip
    
    - name: Upload combined package
      uses: actions/upload-artifact@v4
      with:
        name: sampvoice-all-clients
        path: |
          sv_client_037_r1.zip
          sv_client_037_r3.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: sampvoice-all-clients
        path: release/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/sv_client_037_r1.zip
          release/sv_client_037_r3.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
