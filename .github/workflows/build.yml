name: Build SAMPVOICE

on:
  push:
    branches: [ "release-v3.1", "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "release-v3.1", "main", "master" ]
  workflow_dispatch:

env:
  SOLUTION_FILE: sampvoice.sln

jobs:
  # ============================================
  # Build Client (Windows Only - ASI Plugin)
  # ============================================
  build-client:
    name: Build Client (Windows)
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Install DirectX SDK
      shell: powershell
      run: |
        # Download DirectX SDK June 2010
        $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
        $output = "$env:TEMP\DXSDK_Jun10.exe"
        Write-Host "Downloading DirectX SDK..."
        Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
        
        # Extract (silent install)
        Write-Host "Installing DirectX SDK..."
        Start-Process -FilePath $output -ArgumentList "/U" -Wait
        
        # Set environment variable
        echo "DXSDK_DIR=C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\" >> $env:GITHUB_ENV
    
    - name: Setup Visual Studio Build Tools
      shell: cmd
      run: |
        :: Install v141_xp toolset component if needed
        echo Installing required VS components...
    
    - name: Build Client (Release|Win32)
      working-directory: ${{github.workspace}}
      shell: cmd
      run: |
        :: Try building with v142 toolset (more compatible with GitHub Actions)
        msbuild client/client.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m
      continue-on-error: true
    
    - name: Build Client (Fallback - v142)
      if: failure()
      working-directory: ${{github.workspace}}
      shell: cmd
      run: |
        msbuild client/client.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v142 /p:WindowsTargetPlatformVersion=10.0 /m
    
    - name: Upload Client Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sampvoice-client-windows
        path: bin/sampvoice.asi
        if-no-files-found: warn

  # ============================================
  # Build Server (Windows)
  # ============================================
  build-server-windows:
    name: Build Server (Windows)
    runs-on: windows-2022
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Create output directory
      run: mkdir -p bin
      shell: bash
    
    - name: Build Server (Release|Win32)
      working-directory: ${{github.workspace}}
      shell: cmd
      run: |
        msbuild server/server.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m
    
    - name: Upload Server Artifact (Windows)
      uses: actions/upload-artifact@v4
      with:
        name: sampvoice-server-windows
        path: bin/sampvoice.dll
        if-no-files-found: warn

  # ============================================
  # Build Server (Linux)
  # ============================================
  build-server-linux:
    name: Build Server (Linux)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          g++-multilib \
          gcc-multilib \
          lib32stdc++6 \
          libc6-dev-i386 \
          make
    
    - name: Build Server
      working-directory: ${{github.workspace}}/server
      run: |
        make clean 2>/dev/null || true
        make
    
    - name: Upload Server Artifact (Linux)
      uses: actions/upload-artifact@v4
      with:
        name: sampvoice-server-linux
        path: server/sampvoice.so
        if-no-files-found: warn

  # ============================================
  # Create Release Package
  # ============================================
  package:
    name: Package Release
    runs-on: ubuntu-latest
    needs: [build-client, build-server-windows, build-server-linux]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Create release package
      run: |
        mkdir -p release/client
        mkdir -p release/server/plugins
        mkdir -p release/server/pawno/include
        
        # Copy client files
        cp artifacts/sampvoice-client-windows/sampvoice.asi release/client/ 2>/dev/null || echo "Client ASI not found"
        
        # Copy server files (Windows)
        cp artifacts/sampvoice-server-windows/sampvoice.dll release/server/plugins/ 2>/dev/null || echo "Windows server DLL not found"
        
        # Copy server files (Linux)
        cp artifacts/sampvoice-server-linux/sampvoice.so release/server/plugins/ 2>/dev/null || echo "Linux server SO not found"
        
        # Copy include file
        cp server/sampvoice.inc release/server/pawno/include/
        
        # Create archives
        cd release
        zip -r ../sampvoice-client-${{ github.ref_name }}.zip client/
        zip -r ../sampvoice-server-${{ github.ref_name }}.zip server/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          sampvoice-client-${{ github.ref_name }}.zip
          sampvoice-server-${{ github.ref_name }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
